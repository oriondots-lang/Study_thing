<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="bg"></div>
        <br>
        <main>
            <h1 class='menu'>Chemistry</h1>
            <h1 hidden class='conversion'>Chemistry Conversion</h1>
            <h1 hidden class='element'>Chemistry Elements</h1>
            <h1 hidden class='review'>Chemistry Review</h1>
            <h5 class='switch_words'>Memory Mode:</h5>
            <label class="toggle-switch square">
                <input type="checkbox" id="memory_mode">
                <span class="slider"></span>
            </label>
            <br class='menu'>
            <button onclick="show_page(['menu_button', 'menu'], ['conversion', 'mc_question'])" class='menu_button'>Conversions</button>
            <button onclick="show_page(['menu_button', 'menu'], ['element', 'mc_question'])" class='menu_button'>Elements</button>
            <br class="menu_button">
            <br class="menu_button">
            <button onclick="show_page(['menu_button', 'menu'], ['review', 'mc_question'])" class='menu_button'>Review</button>
            <br hidden class='mc_question'>
            <p hidden class='mc_question' id="conv_q">Insert Question Here?</p>
            <br hidden class='mc_question'>
            <h2 hidden class='show_answer' id="answer_state"></h2>
            <br hidden class='show_answer'>
            <h3 hidden id='correct_answer_text'>Correct Answer: </h3>
            <h3 hidden class='show_answer' id="correct_answer"></h3>
            <br hidden class='show_answer'>
            <button hidden onclick="is_answer(this, 'mc_conversion_button')" class='mc_conversion_button' id="conv_button_a">A</button>
            <button hidden onclick="is_answer(this, 'mc_conversion_button')" class='mc_conversion_button' id="conv_button_b">B</button>
            <br hidden class='mc_conversion_button'>
            <br hidden class='mc_conversion_button'>
            <button hidden onclick="is_answer(this, 'mc_conversion_button')" class='mc_conversion_button' id="conv_button_c">C</button>
            <button hidden onclick="is_answer(this, 'mc_conversion_button')" class='mc_conversion_button' id="conv_button_d">D</button>
            <br hidden class='conversion'>
            <br hidden class='conversion'>
            <button hidden onclick="create_conversion_question(['conv_q'], ['conv_button_a', 'conv_button_b', 'conv_button_c', 'conv_button_d'])" class='conversion' id="conv_button_nq">New Question</button>
            <button hidden onclick="is_answer(this, 'mc_element_button')" class='mc_element_button' id="elem_button_a">A</button>
            <button hidden onclick="is_answer(this, 'mc_element_button')" class='mc_element_button' id="elem_button_b">B</button>
            <br hidden class='mc_element_button'>
            <br hidden class='mc_element_button'>
            <button hidden onclick="is_answer(this, 'mc_element_button')" class='mc_element_button' id="elem_button_c">C</button>
            <button hidden onclick="is_answer(this, 'mc_element_button')" class='mc_element_button' id="elem_button_d">D</button>
            <div hidden class='element_input' id="elem_circle">
                <br hidden class='element_input'>
                <br hidden class='element_input'>
                <br hidden class='element_input'>
                <p hidden class='element_input' id="element_text">Insert element Here</p>
                <div hidden class='element_input' id="elem_input_circle">
                    <input hidden class='element_input' type="number" max="999" min="0" size="3" id="proton_input">
                    <input hidden class='element_input_data' type="number" max="999" min="0" size="3" id="proton_input_data">
                </div>
                <div hidden class='element_input' id="elem_right_input_circle">
                    <input hidden class='element_input' type="number" max="999" min="0" size="3" id="neutron_input">
                    <input hidden class='element_input_data' type="number" max="999" min="0" size="3" id="neutron_input_data">
                </div>
                <div hidden class='element_input' id="elem_bottom_input_circle">
                    <input hidden class='element_input' type="number" max="999" min="0" size="3" id="eletron_input">
                    <input hidden class='element_input_data' type="number" max="999" min="0" size="3" id="eletron_input_data">
                </div>
            </div>
            <br hidden class='element'>
            <br hidden class='element'>
            <button hidden onclick="is_submit_answer(this, 'element_input')" class='element_input' id="submit_button">Submit</button>
            <br hidden class='element_input'>
            <br hidden class='element_input'>
            <button hidden onclick="create_element_question(['conv_q'], ['elem_button_a', 'elem_button_b', 'elem_button_c', 'elem_button_d'])" class='element' id="elem_button_nq">New Question</button>
            <button hidden onclick="is_answer(this, 'mc_review_button')" class='mc_review_button' id="revi_button_a">A</button>
            <button hidden onclick="is_answer(this, 'mc_review_button')" class='mc_review_button' id="revi_button_b">B</button>
            <br hidden class='mc_review_button'>
            <br hidden class='mc_review_button'>
            <button hidden onclick="is_answer(this, 'mc_review_button')" class='mc_review_button' id="revi_button_c">C</button>
            <button hidden onclick="is_answer(this, 'mc_review_button')" class='mc_review_button' id="revi_button_d">D</button>
            <br hidden class='review'>
            <br hidden class='review'>
            <button hidden onclick="is_answer(this, 'mc_review_button')" class='mc_review_button' id="revi_button_e">E</button>
            <button hidden onclick="create_review_question(['conv_q'], ['revi_button_a', 'revi_button_b', 'revi_button_c', 'revi_button_d', 'revi_button_e'])" class='review' id="revi_button_nq">New Question</button>
        </main>
        <br>
        <script src="data.js" defer></script>
    </body>
</html>
